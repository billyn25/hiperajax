name: Verify budgets and search
on:
  push:
    branches: [main]
    paths: ['app.js', 'search_engine.js', 'explorer.js', 'index.html', 'tests/**', '.github/workflows/verify-recents.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test totals, partial search and recent dates
        run: |
          node --check app.js
          node --check search_engine.js
          node --check explorer.js
          node --test tests/saved-totals.test.cjs tests/search.test.cjs tests/search-integration.test.cjs
          for zone in UTC Europe/Madrid America/Los_Angeles; do
            TZ="$zone" node --test tests/recents.test.cjs
          done
      - name: Report published version separately from source tests
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            const expectedApp=sha(fs.readFileSync('app.js'));
            const expectedHtml=sha(fs.readFileSync('index.html'));
            const expectedSearch=sha(fs.readFileSync('search_engine.js'));
            const expectedExplorer=sha(fs.readFileSync('explorer.js'));
            const base='https://ajaxcalc.netlify.app/';
            const started=Date.now();
            for(let attempt=1;attempt<=12;attempt++){
              try{
                const page=await fetch(base,{cache:'no-store',signal:AbortSignal.timeout(10000)});
                if(!page.ok)throw new Error('HTML HTTP '+page.status);
                const html=await page.text();
                const scripts=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/g)].map(x=>x[1]);
                const app=scripts.find(x=>/(?:^|\/)app\.js(?:\?|$)/.test(x));
                if(!app)throw new Error('App script not found');
                const response=await fetch(new URL(app,base),{cache:'no-store',signal:AbortSignal.timeout(10000)});
                if(!response.ok)throw new Error('App HTTP '+response.status);
                const code=await response.text();
                const search=scripts.find(x=>/(?:^|\/)search_engine\.js(?:\?|$)/.test(x));
                if(!search)throw new Error('Search script not found');
                const searchResponse=await fetch(new URL(search,base),{cache:'no-store',signal:AbortSignal.timeout(10000)});
                if(!searchResponse.ok)throw new Error('Search HTTP '+searchResponse.status);
                const searchCode=await searchResponse.text();
                const explorer=scripts.find(x=>/(?:^|\/)explorer\.js(?:\?|$)/.test(x));
                if(!explorer)throw new Error('Explorer script not found');
                const explorerResponse=await fetch(new URL(explorer,base),{cache:'no-store',signal:AbortSignal.timeout(10000)});
                if(!explorerResponse.ok)throw new Error('Explorer HTTP '+explorerResponse.status);
                const explorerCode=await explorerResponse.text();
                const matches=sha(Buffer.from(code))===expectedApp && sha(Buffer.from(html))===expectedHtml && sha(Buffer.from(searchCode))===expectedSearch && sha(Buffer.from(explorerCode))===expectedExplorer;
                console.log(JSON.stringify({attempt,commit:process.env.GITHUB_SHA,publishedApp:app,publishedSearch:search,publishedExplorer:explorer,matchesCommit:matches,hasDateFilter:code.includes('function pmIsRecent('),hasSharedTotals:code.includes('function calcularTotalesPresupuesto(')}));
                if(matches){console.log('PRODUCTION_VERIFIED: published HTML, app, search and Explorer exactly match this tested commit.');return;}
              }catch(e){console.log('Published check: '+e.message);}
              if(Date.now()-started>90000)break;
              if(attempt<12)await wait(5000);
            }
            console.log('PRODUCTION_PENDING: source tests passed, but publication of this commit is not confirmed.');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
